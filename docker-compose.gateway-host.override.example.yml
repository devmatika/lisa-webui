# Optional override when Hermes Gateway runs with network_mode: host and its
# API listens on 127.0.0.1:8642 / :8650 (common single-server Telegram + WebUI setup).
#
# Bridge-network WebUI containers cannot reach the host's 127.0.0.1. This
# override puts WebUI on the host network so BASE_URL=http://127.0.0.1:8650
# works. Nginx can keep proxying to 127.0.0.1:8787.
#
# Usage on the server (do NOT commit secrets):
#   cp docker-compose.gateway-host.override.example.yml docker-compose.override.yml
#   # set HERMES_WEBUI_CHAT_BACKEND=gateway (+ key/url) in .env
#   docker compose up -d
#
# `ports:` is ignored under network_mode: host; WebUI binds HERMES_WEBUI_PORT
# directly on the host. Keep HOST=127.0.0.1 so nginx (same machine) can proxy
# without exposing 8787 on the public interface.
#
# Static binds keep UX hotfixes (approval card layout / Tirith reason text)
# without rebuilding the image after every static tweak.
#
# `/opt/data` must also mount the same Hermes home: Matika profile config and
# `hermes-stt-bridge.sh` use `/opt/data/profiles/...` paths (same as the
# hermes-agent container). Without this mount, mic STT fails with exit 127.
#
# Host Obsidian vaults: workspace/obsidian-vault is an absolute symlink to
# /vaults/<profile>-obsidian. Hermes already mounts /root/vaults:/vaults;
# WebUI needs the same mount or the folder appears broken/empty in the UI.

services:
  hermes-webui:
    network_mode: host
    environment:
      - HERMES_WEBUI_HOST=127.0.0.1
    volumes:
      - ${HERMES_HOME:-${HOME}/.hermes}:/opt/data
      - /root/vaults:/vaults
      - ./static/boot.js:/apptoo/static/boot.js:ro
      - ./static/messages.js:/apptoo/static/messages.js:ro
      - ./static/panels.js:/apptoo/static/panels.js:ro
      - ./static/index.html:/apptoo/static/index.html:ro
      - ./static/style.css:/apptoo/static/style.css:ro
